<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d0f13" />
    <meta
      name="description"
      content="حوّل ملفات PDF إلى الوضع الداكن"
    />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="مريح" />
    <title>مريح</title>
  </head>
  <body>
    <div id="app">
      <header>
        <h1>مريح</h1>
        <p class="tagline">حوّل ملفات PDF إلى الوضع الداكن</p>
      </header>

      <main>
        <section id="dropzone" role="button" tabindex="0" aria-label="اختر ملف PDF">
          <input id="file" type="file" accept="application/pdf" hidden />
          <div class="drop-icon" aria-hidden="true"></div>
        </section>

        <div id="status" role="status" aria-live="polite" hidden></div>

        <div id="progress-wrap" hidden>
          <div id="progress-track">
            <div
              id="progress-bar"
              role="progressbar"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="0"
            ></div>
          </div>
          <div class="progress-row">
            <span id="progress-text" aria-live="polite"></span>
            <button id="cancel" type="button">إلغاء</button>
          </div>
        </div>

        <div id="result" role="status" aria-live="polite" hidden>
          <p id="done-text">تم التحويل بنجاح</p>
          <p id="stats"></p>
          <button id="download" class="primary" type="button">تحميل الملف المحوّل</button>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
